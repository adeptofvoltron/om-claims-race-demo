name: test

# Deliberately unfiltered: whether lock refs under refs/om-locks/ start a run here
# is one of the things this demo observes.
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm test
